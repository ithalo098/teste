<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Histórico de Tarefas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/tabelas.css">
</head>
<body class="bg-light p-4">
  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2><i class="bi bi-clock-history me-2"></i>Histórico de Atividades</h2>
      <a href="../index.html" class="btn btn-outline-secondary">Voltar</a>
    </div>
    <div class="card p-3 shadow-sm border-0">
      <table class="table table-hover" id="tabelaHistorico">
        <thead>
          <tr>
            <th>Data e Hora</th>
            <th>Ação</th>
            <th>Tarefa</th>
            <th>Detalhes</th>
          </tr>
        </thead>
        <tbody id="corpoTabelaHistorico">
          <!-- Linhas do historico -->
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
