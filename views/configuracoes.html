<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Configurações</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-light p-4">
  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2><i class="bi bi-gear me-2"></i>Configurações do Usuário</h2>
      <a href="../index.html" class="btn btn-outline-secondary">Voltar</a>
    </div>
    <div class="card p-4 shadow-sm border-0">
      <div class="mb-3">
        <label class="form-label fw-bold">Nome do Aluno</label>
        <input type="text" class="form-control" id="configNomeAluno" value="Íthalo">
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">Laboratório Habitual</label>
        <input type="text" class="form-control" id="configLab" value="Lab 04 - Informática">
      </div>
      <button class="btn btn-success" id="btnSalvarConfig">Salvar Preferências</button>
    </div>
  </div>
</body>
</html>
