<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Ajuda e Instruções</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="p-4">
  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2><i class="bi bi-question-circle me-2"></i>Central de Ajuda</h2>
      <a href="../index.html" class="btn btn-outline-secondary">Voltar</a>
    </div>
    <div class="card p-4 shadow-sm border-0">
      <h4>Como usar o TaskMaster Desktop</h4>
      <p>Guia rapido para utilizacao do sistema desenvolvido pelo trio.</p>
      <div class="accordion" id="accordionAjuda">
        <div class="accordion-item">
          <h2 class="accordion-header">
            <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#ajuda1">
              Como adicionar uma nova tarefa?
            </button>
          </h2>
          <div id="ajuda1" class="accordion-collapse collapse show">
            <div class="accordion-body">
              Basta preencher o titulo da tarefa no formulario da esquerda e clicar em Adicionar.
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
