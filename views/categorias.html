<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Gerenciar Categorias</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="p-4">
  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2><i class="bi bi-tags me-2"></i>Categorias de Tarefas</h2>
      <a href="../index.html" class="btn btn-outline-secondary">Voltar</a>
    </div>
    <div class="row g-4">
      <div class="col-md-4">
        <div class="card p-3 shadow-sm border-0">
          <h5>Nova Categoria</h5>
          <form id="formNovaCategoria">
            <div class="mb-3">
              <label class="form-label small fw-bold">Nome</label>
              <input type="text" id="nomeCategoria" class="form-control" required>
            </div>
            <button class="btn btn-primary w-100">Salvar Categoria</button>
          </form>
        </div>
      </div>
      <div class="col-md-8">
        <div class="card p-3 shadow-sm border-0" id="listaCategoriasContainer">
        </div>
      </div>
    </div>
  </div>
</body>
</html>
