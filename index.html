<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minhas Tarefas Desktop</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Estilos locais do projeto -->
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/tabelas.css">
  <link rel="stylesheet" href="css/modais.css">
  <link rel="stylesheet" href="css/responsivo.css">
  <link rel="stylesheet" href="css/tema-escuro.css">
</head>
<body class="bg-light">

  <!-- Barra de navegacao superior -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="index.html">
        <i class="bi bi-check2-square fs-4"></i>
        <span>Minhas Tarefas <span class="badge bg-light text-primary fs-6">Desktop</span></span>
      </a>
      <div class="d-flex align-items-center gap-3">
        <span class="text-white small d-none d-md-inline">Trabalho Desktop - Grau Tecnico</span>
        <button id="btnAlternarTema" class="btn btn-outline-light btn-sm" title="Alternar Modo Escuro">
          <i class="bi bi-moon-stars"></i>
        </button>
      </div>
    </div>
  </nav>

  <!-- Container principal -->
  <main class="container mb-5">
    <!-- Linha de cards com contadores no topo -->
    <div class="row g-3 mb-4" id="painel-estatisticas">
      <div class="col-md-4">
        <div class="card p-3 bg-white border-0 shadow-sm border-start border-primary border-4">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <span class="text-muted small fw-bold">TOTAL DE TAREFAS</span>
              <h3 class="fw-bold mb-0 text-primary" id="totalQtd">0</h3>
            </div>
            <i class="bi bi-list-task fs-1 text-primary opacity-50"></i>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card p-3 bg-white border-0 shadow-sm border-start border-warning border-4">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <span class="text-muted small fw-bold">PENDENTES</span>
              <h3 class="fw-bold mb-0 text-warning" id="pendentesQtd">0</h3>
            </div>
            <i class="bi bi-clock-history fs-1 text-warning opacity-50"></i>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card p-3 bg-white border-0 shadow-sm border-start border-success border-4">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <span class="text-muted small fw-bold">CONCLUÍDAS</span>
              <h3 class="fw-bold mb-0 text-success" id="concluidasQtd">0</h3>
            </div>
            <i class="bi bi-check2-circle fs-1 text-success opacity-50"></i>
          </div>
        </div>
      </div>
    </div>

    <!-- Grid com formulario na esquerda e lista na direita -->
    <div class="row g-4">
      <!-- Coluna da Esquerda: Formulario -->
      <div class="col-lg-4" id="coluna-form">
        <div class="card shadow-sm border-0 mb-4 bg-white">
          <div class="card-header bg-white py-3 border-0">
            <h5 class="card-title mb-0 fw-bold text-primary">
              <i class="bi bi-plus-circle me-1"></i> Nova Tarefa
            </h5>
          </div>
          <div class="card-body">
            <form id="formTarefa">
              <div class="mb-3">
                <label for="titulo" class="form-label small fw-bold">Título da tarefa *</label>
                <input type="text" class="form-control" id="titulo" placeholder="Ex: Estudar comandos SQL" required>
              </div>

              <div class="mb-3">
                <label for="descricao" class="form-label small fw-bold">Descrição detalhada</label>
                <textarea class="form-control" id="descricao" rows="3" placeholder="Anotações e detalhes..."></textarea>
              </div>

              <div class="mb-3">
                <label for="categoria" class="form-label small fw-bold">Categoria</label>
                <select class="form-select" id="categoria">
                  <option value="redes">Redes de Computadores</option>
                  <option value="hardware">Manutenção de Hardware</option>
                  <option value="programacao" selected>Desenvolvimento e Lógica</option>
                  <option value="banco_dados">Banco de Dados</option>
                  <option value="sistemas">Sistemas Operacionais</option>
                  <option value="geral">Geral / Escola</option>
                </select>
              </div>

              <div class="row g-2 mb-3">
                <div class="col-6">
                  <label for="prioridade" class="form-label small fw-bold">Prioridade</label>
                  <select class="form-select" id="prioridade">
                    <option value="baixa">Baixa</option>
                    <option value="media" selected>Média</option>
                    <option value="alta">Alta</option>
                  </select>
                </div>
                <div class="col-6">
                  <label for="dataLimite" class="form-label small fw-bold">Data Entrega</label>
                  <input type="date" class="form-control" id="dataLimite">
                </div>
              </div>

              <button type="submit" class="btn btn-primary w-100 fw-bold">
                <i class="bi bi-save me-1"></i> Adicionar Tarefa
              </button>
            </form>
          </div>
        </div>
      </div>

      <!-- Coluna da Direita: Barra de Busca e Lista -->
      <div class="col-lg-8" id="coluna-lista">
        <div class="card shadow-sm border-0 mb-3 bg-white p-3">
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-search text-muted"></i></span>
            <input type="text" id="campoPesquisa" class="form-control border-start-0 bg-light" placeholder="Pesquisar tarefas por título ou descrição...">
          </div>
          <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top flex-wrap gap-2">
            <div class="btn-group btn-group-sm" role="group">
              <button class="btn btn-outline-primary active btn-status" data-status="todas">Todas</button>
              <button class="btn btn-outline-primary btn-status" data-status="pendentes">Pendentes</button>
              <button class="btn btn-outline-primary btn-status" data-status="concluidas">Concluídas</button>
            </div>
            <div class="btn-group btn-group-sm" role="group">
              <button class="btn btn-outline-secondary active btn-prio" data-prio="todas">Todas</button>
              <button class="btn btn-outline-danger btn-prio" data-prio="alta">Alta</button>
              <button class="btn btn-outline-warning btn-prio" data-prio="media">Média</button>
              <button class="btn btn-outline-success btn-prio" data-prio="baixa">Baixa</button>
            </div>
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-2 px-1">
          <span class="small text-muted fw-bold" id="rotuloQtd">Tarefas</span>
          <button id="btnLimparFeitas" class="btn btn-sm btn-link text-danger text-decoration-none">
            <i class="bi bi-trash3 me-1"></i> Limpar tarefas concluídas
          </button>
        </div>

        <div id="listaTarefasCards" class="d-flex flex-column gap-3">
          <!-- Tarefas renderizadas dinamicamente aqui -->
        </div>
      </div>
    </div>
  </main>

  <!-- Modais -->
  <div class="modal fade" id="modalConfirmar" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title text-danger"><i class="bi bi-exclamation-triangle me-1"></i> Confirmar Exclusão</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          Tem certeza de que deseja apagar esta tarefa?
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-danger" id="btnSimExcluir">Sim, Excluir</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="modalEditar" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-pencil-square me-1"></i> Editar Tarefa</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="formEditar">
            <input type="hidden" id="editId">
            <div class="mb-3">
              <label class="form-label small fw-bold">Título</label>
              <input type="text" id="editTitulo" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold">Descrição</label>
              <textarea id="editDescricao" class="form-control" rows="3"></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold">Prioridade</label>
              <select id="editPrioridade" class="form-select">
                <option value="baixa">Baixa</option>
                <option value="media">Média</option>
                <option value="alta">Alta</option>
              </select>
            </div>
            <div class="text-end">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-primary">Salvar Alterações</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="toastAviso" class="toast align-items-center text-bg-success border-0" role="alert">
      <div class="d-flex">
        <div class="toast-body" id="toastTexto">Ação realizada!</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="config/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/dados_iniciais.js"></script>
  <script src="js/tarefas.js"></script>
  <script src="js/filtros.js"></script>
  <script src="js/validacoes.js"></script>
  <script src="js/categorias.js"></script>
  <script src="js/estatisticas.js"></script>
  <script src="js/graficos.js"></script>
  <script src="js/historico.js"></script>
  <script src="js/notificacoes.js"></script>
  <script src="js/exportar.js"></script>
  <script src="js/atalhos.js"></script>
  <script src="js/configuracoes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
